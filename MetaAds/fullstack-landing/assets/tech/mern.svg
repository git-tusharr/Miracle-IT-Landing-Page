<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="64" height="64" fill="none">
  <!-- Glowing Hexagonal Outer Container -->
  <rect width="128" height="128" rx="28" fill="#0B132B"/>
  <rect x="1" y="1" width="126" height="126" rx="27" stroke="url(#mern_border)" stroke-width="2"/>
  
  <!-- Subtle Gradient Background Glow -->
  <circle cx="64" cy="64" r="42" fill="url(#mern_core_glow)" opacity="0.25"/>

  <!-- React Atom in Center -->
  <g transform="translate(64, 52) scale(2.2)">
    <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(30)"/>
    <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(90)"/>
    <ellipse cx="0" cy="0" rx="10" ry="3.8" fill="none" stroke="#61DAFB" stroke-width="1.3" transform="rotate(150)"/>
    <circle cx="0" cy="0" r="2.2" fill="#61DAFB"/>
  </g>

  <!-- M-E-R-N Stack Badges at Bottom -->
  <g transform="translate(18, 92)">
    <rect x="0" y="0" width="18" height="16" rx="4" fill="#13AA52" fill-opacity="0.2" stroke="#13AA52" stroke-width="1"/>
    <text x="9" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#13AA52" text-anchor="middle">M</text>
    
    <rect x="24" y="0" width="18" height="16" rx="4" fill="#FFFFFF" fill-opacity="0.12" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <text x="33" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">E</text>
    
    <rect x="48" y="0" width="18" height="16" rx="4" fill="#61DAFB" fill-opacity="0.2" stroke="#61DAFB" stroke-width="1"/>
    <text x="57" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#61DAFB" text-anchor="middle">R</text>
    
    <rect x="72" y="0" width="18" height="16" rx="4" fill="#539E43" fill-opacity="0.2" stroke="#539E43" stroke-width="1"/>
    <text x="81" y="12" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#539E43" text-anchor="middle">N</text>
  </g>

  <defs>
    <linearGradient id="mern_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="50%" stop-color="#13AA52"/>
      <stop offset="100%" stop-color="#539E43"/>
    </linearGradient>
    <radialGradient id="mern_core_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
