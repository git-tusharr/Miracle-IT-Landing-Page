<!-- ==========================================================================
     MOBILE STICKY CTA BAR
     Thumb-zone conversion bar for mobile paid traffic (< 768px)
     ========================================================================== -->
<link rel="stylesheet" href="./components/mobile-sticky-cta/mobile-sticky-cta.css">
<div class="mobile-sticky-bar" id="mobileStickyBar" aria-label="Quick Contact & Booking Actions">
  <div class="mobile-sticky-container">
    
    <!-- Action 1: Call -->
    <a href="tel:+919876543210" class="mobile-sticky-btn call-action" data-config-phone data-track-cta="sticky_mobile_call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sticky-icon">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
      </svg>
      <span>Call</span>
    </a>

    <!-- Action 2: WhatsApp -->
    <a href="#" class="mobile-sticky-btn whatsapp-action" data-config-whatsapp data-track-cta="sticky_mobile_whatsapp">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sticky-icon">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <span>WhatsApp</span>
    </a>

    <!-- Action 3: Book Visit (Primary) -->
    <a href="#counselling-form" class="mobile-sticky-btn book-action" data-track-cta="sticky_mobile_book">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="sticky-icon">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span>Book Visit</span>
    </a>

  </div>
</div>
