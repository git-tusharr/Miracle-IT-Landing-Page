<!-- ==========================================================================
     HEADER COMPONENT — PREMIUM RESPONSIVE GLASS HEADER
     MIRACLE IT CAREER ACADEMY
     ========================================================================== -->

<link rel="stylesheet" href="./components/header/header.css">

<header class="site-header" id="siteHeader">

  <div class="container header-container">

    <!-- ======================================================================
         BRAND
         ====================================================================== -->

    <a
      href="./"
      class="brand-logo"
      aria-label="Miracle IT Career Academy Homepage"
    >

      <div class="logo-mark">
        <img
          src="./assets/images/miracle-it-emblem.png"
          alt="Miracle IT Emblem"
          class="brand-emblem-img"
          width="44"
          height="36"
        >
      </div>

      <div class="logo-text">
        <span class="brand-name">
          Miracle <span class="gradient-text">IT</span>
        </span>

        <span class="brand-sub">
          Career Academy • Bhopal
        </span>
      </div>

    </a>


    <!-- ======================================================================
         DESKTOP / TABLET NAVIGATION
         ====================================================================== -->

    <nav
      class="header-nav"
      id="navMenu"
      aria-label="Main Navigation"
    >

      <ul class="nav-list">

        <li>
          <a href="#courses" class="nav-link">
            Courses
          </a>
        </li>

        <li>
          <a href="#why-miracle-it" class="nav-link">
            Why Miracle IT
          </a>
        </li>

        <li>
          <a href="#proof" class="nav-link">
            Reviews/Proof
          </a>
        </li>

        <li>
          <a href="#location" class="nav-link">
            Location
          </a>
        </li>

      </ul>


      <!-- ==============================================================
           MOBILE MENU ACTIONS
           ============================================================== -->

      <div class="mobile-nav-actions">

        <a
          href="tel:+919876543210"
          class="btn btn-secondary btn-full"
          data-config-phone
          data-track-cta="header_call_mobile"
        >
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2
              19.79 19.79 0 0 1-8.63-3.07
              19.5 19.5 0 0 1-6-6
              19.79 19.79 0 0 1-3.07-8.67
              A2 2 0 0 1 4.11 2h3
              a2 2 0 0 1 2 1.72
              12.84 12.84 0 0 0 .7 2.81
              2 2 0 0 1-.45 2.11
              L8.09 9.91
              a16 16 0 0 0 6 6
              l1.27-1.27
              a2 2 0 0 1 2.11-.45
              12.84 12.84 0 0 0 2.81.7
              A2 2 0 0 1 22 16.92z"
            />
          </svg>
          <span data-config-text="phoneDisplay">
            Call Us
          </span>
        </a>

        <a
          href="#"
          class="btn btn-secondary btn-full"
          data-config-whatsapp
          data-track-cta="header_whatsapp_mobile"
        >
          <svg
            class="btn-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span>
            WhatsApp
          </span>
        </a>

        <a
          href="#counselling-form"
          class="btn btn-primary btn-full btn-magnetic"
          data-track-cta="header_book_mobile"
        >
          Book Free Counselling Visit
        </a>

      </div>

    </nav>


    <!-- ======================================================================
         DESKTOP HEADER ACTIONS: Call/WhatsApp | Book Visit
         ====================================================================== -->

    <div class="header-actions">

      <!-- Call / WhatsApp Action Group -->
      <div class="header-call-whatsapp" aria-label="Contact Options">
        <a
          href="tel:+919876543210"
          class="header-contact-pill call-pill"
          data-config-phone
          data-track-cta="header_phone_desktop"
          title="Call Academy"
        >
          <svg
            class="contact-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2
              19.79 19.79 0 0 1-8.63-3.07
              19.5 19.5 0 0 1-6-6
              19.79 19.79 0 0 1-3.07-8.67
              A2 2 0 0 1 4.11 2h3
              a2 2 0 0 1 2 1.72
              12.84 12.84 0 0 0 .7 2.81
              2 2 0 0 1-.45 2.11
              L8.09 9.91
              a16 16 0 0 0 6 6
              l1.27-1.27
              a2 2 0 0 1 2.11-.45
              12.84 12.84 0 0 0 2.81.7
              A2 2 0 0 1 22 16.92z"
            />
          </svg>
          <span class="contact-text">Call</span>
        </a>

        <span class="contact-sep" aria-hidden="true">/</span>

        <a
          href="#"
          class="header-contact-pill whatsapp-pill"
          data-config-whatsapp
          data-track-cta="header_whatsapp_desktop"
          title="Chat on WhatsApp"
        >
          <svg
            class="contact-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
          </svg>
          <span class="contact-text">WhatsApp</span>
        </a>
      </div>


      <!-- Main CTA: Book Visit -->
      <a
        href="#counselling-form"
        class="btn btn-primary btn-sm header-book-btn btn-magnetic"
        data-track-cta="header_book_counselling"
      >
        <span>Book Visit</span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          class="btn-icon"
          style="width:14px;height:14px;"
          aria-hidden="true"
        >
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </a>


      <!-- Mobile Hamburger -->

      <button
        class="nav-toggle"
        id="navToggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="navMenu"
      >

        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>

      </button>

    </div>

  </div>

</header>
