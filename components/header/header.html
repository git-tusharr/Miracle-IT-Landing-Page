<!-- ==========================================================================
     HEADER COMPONENT — REFINED & OPTIMIZED DESIGN
     ========================================================================== -->
<link rel="stylesheet" href="./components/header/header.css">
<header class="site-header" id="siteHeader">
  <div class="container header-container">
    
    <!-- Academy Logo & Branding -->
    <a href="./" class="brand-logo" aria-label="Miracle IT Career Academy Homepage">
      <div class="logo-mark">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="40" height="40" rx="10" fill="url(#logo-grad)"/>
          <path d="M12 28V12L20 20L28 12V28" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="20" cy="25" r="2.5" fill="#F59E0B"/>
          <defs>
            <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1D4ED8"/>
              <stop offset="1" stop-color="#0F172A"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="logo-text">
        <span class="brand-name">Miracle IT</span>
        <span class="brand-sub">Career Academy • Bhopal</span>
      </div>
    </a>

    <!-- Desktop Navigation Menu -->
    <nav class="header-nav" id="navMenu" aria-label="Main Navigation">
      <ul class="nav-list">
        <li><a href="#problem" class="nav-link">Dilemma</a></li>
        <li><a href="#courses" class="nav-link">Courses</a></li>
        <li><a href="#why-miracle-it" class="nav-link">Why Miracle IT</a></li>
        <li><a href="#learning-experience" class="nav-link">Lab & Class</a></li>
        <li><a href="#counselling-process" class="nav-link">Process</a></li>
        <li><a href="#location" class="nav-link">Location</a></li>
        <li><a href="#faq" class="nav-link">FAQs</a></li>
      </ul>
      
      <!-- Mobile Drawer Extra Actions -->
      <div class="mobile-nav-actions">
        <a href="tel:+919876543210" class="btn btn-secondary btn-full" data-config-phone data-track-cta="header_call_mobile">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span data-config-text="phoneDisplay">Call Us</span>
        </a>
        <a href="#counselling-form" class="btn btn-primary btn-full" data-track-cta="header_book_mobile">
          Book Free Visit
        </a>
      </div>
    </nav>

    <!-- Header Actions (Desktop) -->
    <div class="header-actions">
      <a href="tel:+919876543210" class="header-phone-link" data-config-phone data-track-cta="header_phone_desktop" title="Call Academy">
        <svg class="phone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
        <span class="phone-text">
          <span class="phone-label">Helpline</span>
          <span class="phone-number" data-config-text="phoneDisplay">+91 98765 43210</span>
        </span>
      </a>

      <a href="#counselling-form" class="btn btn-primary btn-sm header-book-btn" data-track-cta="header_book_counselling">
        Book Free Visit
      </a>

      <!-- Mobile Hamburger Button -->
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
        <span class="hamburger-bar"></span>
      </button>
    </div>

  </div>
</header>
